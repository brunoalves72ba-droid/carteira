<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carteira">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Carteira</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050507;--pn:#0a0a0f;--in:#08080c;--sf:rgba(255,255,255,.025);--sf2:rgba(255,255,255,.05);--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.12);--fg:#ececf1;--mu:#8a8a99;--mu2:#55556a;--p1:#a855f7;--p2:#7c3aed;--p3:#c4b5fd;--em:#34d399;--ro:#f87171;--am:#fbbf24;--grad:linear-gradient(135deg,#5b21b6 0%,#7c3aed 45%,#a855f7 100%);--sh:0 24px 48px -28px rgba(0,0,0,.9);color-scheme:dark}
*,*:before,*:after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:14px/1.5 'Inter',system-ui,sans-serif;font-feature-settings:'cv11','ss01','tnum';-webkit-font-smoothing:antialiased;background-image:radial-gradient(900px 480px at 100% -10%,rgba(124,58,237,.16),transparent 60%),radial-gradient(700px 500px at 0% 110%,rgba(91,33,182,.10),transparent 60%);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
::selection{background:rgba(168,85,247,.4)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:9px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
.n{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mu{color:var(--mu)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.lab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);font-weight:600}
.pos{color:var(--em)}.neg{color:var(--ro)}.amb{color:var(--am)}
#nav{position:fixed;z-index:20;background:rgba(6,6,9,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:0 solid var(--bd)}
.in{max-width:1200px;margin:0 auto;padding:calc(32px + env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-right,0px)) 56px max(28px,env(safe-area-inset-left,0px));display:grid;gap:20px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:4px}
.hd h1{font-size:28px;font-weight:600;letter-spacing:-.03em;margin:4px 0 0;line-height:1.15}
.hd p{margin:4px 0 0}
.crumb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--p3);font-weight:600;opacity:.85}
.hr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.g2{display:grid;gap:20px;grid-template-columns:1fr 1fr}
.g21{display:grid;gap:20px;grid-template-columns:1.7fr 1fr}
.g32{display:grid;gap:20px;grid-template-columns:1.5fr 1fr}
.gk{display:grid;gap:14px;grid-template-columns:repeat(4,1fr)}
.gb{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.sp{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fx{display:flex;align-items:center;gap:10px}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.012));border:1px solid var(--bd);border-radius:16px;padding:22px;box-shadow:var(--sh);min-width:0}
.ct{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em}
.ct svg{color:var(--p1)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:28px;border:1px solid rgba(168,85,247,.28);background:radial-gradient(560px 300px at 100% 0%,rgba(168,85,247,.32),transparent 62%),radial-gradient(520px 320px at -10% 120%,rgba(91,33,182,.38),transparent 62%),linear-gradient(135deg,#150a26 0%,#0b0714 55%,#060509 100%);box-shadow:0 30px 60px -36px rgba(124,58,237,.7);min-width:0}
.hero:before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(196,181,253,.7),transparent)}
.hero>*{position:relative}
.big{display:block;font-size:clamp(2.2rem,5.6vw,3.2rem);font-weight:500;line-height:1.05;margin:10px 0 6px;letter-spacing:-.04em}
.hs{display:grid;gap:12px;grid-template-columns:repeat(3,1fr);margin-top:22px}
.hs>div{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:12px 14px}
.hs b{display:block;font-size:16px;font-weight:600;margin-top:4px}
.hl{color:#c9c3dc}
.kpi{display:flex;gap:14px;align-items:flex-start}
.kt{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;border:1px solid rgba(168,85,247,.25);background:rgba(168,85,247,.08);color:var(--p3)}
.kv{font-size:21px;font-weight:600;margin-top:4px;line-height:1.2;white-space:nowrap;letter-spacing:-.025em}
.trend{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13px;color:#fff;background:var(--grad);box-shadow:0 10px 24px -14px rgba(168,85,247,.9),inset 0 1px 0 rgba(255,255,255,.18);transition:filter .15s,transform .15s;white-space:nowrap;letter-spacing:-.005em}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.g{background:rgba(255,255,255,.03);border:1px solid var(--bd2);box-shadow:none;color:var(--fg)}
.btn.g:hover{border-color:rgba(168,85,247,.45);background:rgba(168,85,247,.08)}
.btn.d{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);color:var(--ro);box-shadow:none}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.ib{width:34px;height:34px;flex:none;border:1px solid var(--bd2);background:rgba(255,255,255,.02);border-radius:9px;display:inline-grid;place-items:center;color:var(--fg);transition:.15s}
.ib:hover{background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.45);color:#fff}
.link{background:none;border:0;padding:0;color:var(--p3);font-weight:500;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.link:hover{color:#fff}
.link.dl{color:var(--ro)}
.ms{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.02);border:1px solid var(--bd2);border-radius:11px;padding:3px}
.ms .ib{border:0;width:30px;height:30px;background:none}
.ms b{min-width:150px;text-align:center;font-size:13px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500;background:rgba(255,255,255,.04);border:1px solid var(--bd);color:var(--mu);white-space:nowrap;line-height:1.6}
.chip.rec{color:#d8b4fe;background:rgba(168,85,247,.10);border-color:rgba(168,85,247,.3)}
.chip.pend{color:#fcd34d;background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.25)}
.chip.ok{color:#6ee7b7;background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.25)}
.chip.late{color:#fca5a5;background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.3)}
button.chip{cursor:pointer;margin-top:5px}
button.chip:hover{filter:brightness(1.3)}
.tx{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:12px;transition:background .15s;border:1px solid transparent}
.tx:hover{background:rgba(255,255,255,.03);border-color:var(--bd)}
.ico{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;position:relative}
.ico .rb{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:6px;background:#1a1028;border:1px solid rgba(168,85,247,.5);display:grid;place-items:center;color:#d8b4fe}
.tm{flex:1;min-width:0}
.tm .t{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:0;text-align:left;max-width:100%;display:block;letter-spacing:-.01em}
.tm .t:hover{color:var(--p3)}
.tm .s{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:12px;color:var(--mu)}
.tv{text-align:right;flex:none}
.tv b{font-size:14.5px;font-weight:600;display:block;letter-spacing:-.02em}
.tact{display:flex;gap:4px;opacity:0;transition:.15s}
.tx:hover .tact{opacity:1}
.tact button{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:rgba(255,255,255,.02);display:grid;place-items:center;color:var(--mu)}
.tact button:hover{color:var(--fg);border-color:rgba(168,85,247,.45)}
.tact .dl:hover{color:var(--ro);border-color:rgba(248,113,113,.4)}
.dh{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);font-weight:600;margin:20px 8px 6px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.dh:first-child{margin-top:0}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.bud{padding:13px 6px;border-top:1px solid var(--bd);cursor:pointer;border-radius:8px}
.bud:hover{background:rgba(255,255,255,.02)}
.bud:first-of-type{border-top:0}
.bc{cursor:pointer;transition:border-color .15s,background .15s}
.bc:hover{border-color:rgba(168,85,247,.4)}
label{display:block;font-size:12px;color:var(--mu);font-weight:500;margin:14px 0 6px}
input,select{width:100%;background:var(--in);border:1px solid var(--bd2);border-radius:10px;padding:11px 13px;color:var(--fg);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:rgba(168,85,247,.7);box-shadow:0 0 0 3px rgba(168,85,247,.16)}
input::placeholder{color:var(--mu2)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.75);cursor:pointer}
select option,select optgroup{background:#0e0b16;color:var(--fg)}
.fr{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.seg{display:flex;gap:3px;background:var(--in);border:1px solid var(--bd2);padding:3px;border-radius:11px}
.seg button{flex:1;border:0;background:none;padding:9px 10px;border-radius:8px;font-weight:600;font-size:13px;color:var(--mu);transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.seg button:hover{color:var(--fg)}
.seg .on{background:var(--grad);color:#fff;box-shadow:0 6px 18px -10px rgba(168,85,247,.9)}
.seg .on.out{background:linear-gradient(135deg,#3b0f2a,#5b1a3a);color:#fecdd3;box-shadow:inset 0 0 0 1px rgba(248,113,113,.35)}
.seg .on.inc{background:linear-gradient(135deg,#0c2a22,#11392d);color:#a7f3d0;box-shadow:inset 0 0 0 1px rgba(52,211,153,.35)}
.vin{position:relative}
.vin span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-weight:500;color:var(--mu);font-size:16px}
.vin input{padding:15px 16px 15px 50px;font-size:26px;font-weight:500;letter-spacing:-.03em;border-radius:12px}
.box{margin-top:16px;border:1px solid rgba(168,85,247,.3);background:linear-gradient(180deg,rgba(124,58,237,.10),rgba(124,58,237,.02));border-radius:14px;padding:16px}
.box.off{border-color:var(--bd);background:rgba(255,255,255,.015)}
.prev{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.note{font-size:12.5px;padding:10px 12px;border-radius:10px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.22);color:#fde68a;margin-top:12px;line-height:1.5}
.note.info{background:rgba(168,85,247,.07);border-color:rgba(168,85,247,.25);color:#ddd6fe}
.note.bad{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.28);color:#fecaca}
.alert{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:14px;background:linear-gradient(90deg,rgba(248,113,113,.10),rgba(248,113,113,.02));border:1px solid rgba(248,113,113,.28)}
.alert .kt{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.1);color:#fca5a5}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 30px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 10px 26px -12px rgba(168,85,247,.9),inset 0 1px 0 rgba(255,255,255,.25)}
.brand b{font-size:16px;font-weight:600;letter-spacing:-.02em;display:block;line-height:1.2}
.nl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu2);font-weight:600;padding:0 12px 8px}
.ni{display:flex;align-items:center;gap:12px;width:100%;border:1px solid transparent;background:none;padding:10px 12px;border-radius:10px;font-weight:500;font-size:13.5px;color:var(--mu);margin-bottom:2px;transition:.15s;position:relative;text-align:left}
.ni:hover{color:var(--fg);background:rgba(255,255,255,.03)}
.ni.on{color:#fff;background:linear-gradient(90deg,rgba(124,58,237,.22),rgba(124,58,237,.04));border-color:rgba(168,85,247,.22)}
.ni.on svg{color:#c4b5fd}
.ni.on:before{content:'';position:absolute;left:-17px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#c4b5fd,#7c3aed)}
.ni .cnt{margin-left:auto;font-size:10.5px;font-style:normal;font-weight:600;background:rgba(248,113,113,.14);color:#fca5a5;border-radius:6px;padding:1px 7px}
.nb{margin-top:auto;padding:16px;border-radius:14px;background:linear-gradient(160deg,rgba(124,58,237,.12),rgba(124,58,237,.02));border:1px solid rgba(168,85,247,.18)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#md.on{display:flex}
#md .card{width:100%;max-width:540px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#110c1b,#09080d);border-color:rgba(168,85,247,.22);animation:pop .18s ease-out;box-shadow:0 40px 80px -30px rgba(0,0,0,.9),0 0 0 1px rgba(0,0,0,.4)}
#md .card.s{max-width:430px}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
.mh h3{margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em}
.actions{display:flex;gap:8px;margin-top:20px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#120d1c;border:1px solid rgba(168,85,247,.4);padding:11px 16px;border-radius:12px;font-weight:500;z-index:60;box-shadow:var(--sh);animation:pop .2s;display:flex;align-items:center;gap:10px}
.toast svg{color:#c4b5fd}
.empty{text-align:center;padding:30px 12px;color:var(--mu);font-size:13px}
.empty .e{width:44px;height:44px;border-radius:12px;margin:0 auto 10px;display:grid;place-items:center;border:1px solid rgba(168,85,247,.25);background:rgba(168,85,247,.06);color:var(--p3)}
.leg{display:grid;gap:10px}
.leg div{display:flex;align-items:center;gap:10px;font-size:12.5px}
.leg i{width:8px;height:8px;border-radius:2px;flex:none}
.leg span{flex:1;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters{display:grid;gap:12px;grid-template-columns:2fr 1.2fr 1.4fr 1fr 1fr}
.filters label{margin-top:0}
.sx{position:relative}.sx svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu)}.sx input{padding-left:38px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{background:rgba(255,255,255,.02);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;min-width:0}
.mini b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tl{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.tl .it{flex:none;width:168px;border-radius:12px;padding:14px;background:rgba(255,255,255,.02);border:1px solid var(--bd)}
.tl .dd{font-size:26px;font-weight:500;line-height:1;letter-spacing:-.04em}
details summary{cursor:pointer;color:var(--mu);font-weight:500;font-size:13px;list-style:none;padding:4px 0;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
.lgd{display:flex;gap:16px;font-size:12px;color:var(--mu)}
.lgd i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:0}
.sep{height:1px;background:var(--bd);margin:4px 0}
.ns{display:none}.mob{display:none}
.demo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 16px;align-items:center;padding:16px 18px;border-radius:14px;background:linear-gradient(90deg,rgba(124,58,237,.16),rgba(124,58,237,.03));border:1px solid rgba(168,85,247,.35)}
.demo .dt{display:grid;gap:3px;min-width:0}.demo .dt b{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.demo .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:899px){.demo{grid-template-columns:auto minmax(0,1fr);padding:16px}.demo .acts{grid-column:1/-1}.demo .acts .btn{flex:1 1 140px}.demo .acts .link{flex-basis:100%;justify-content:center;padding:4px 0}}
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--bd);border-radius:12px;background:rgba(255,255,255,.015)}
.fr3{display:grid;gap:8px;grid-template-columns:1.3fr 1fr 1.2fr}
.vin.vs input{font-size:20px;padding:12px 14px 12px 46px}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pm{margin:0;position:relative}
.pm span{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu2);font-weight:600;pointer-events:none}
.pm input{padding:10px 10px 10px 40px;text-align:right;font-variant-numeric:tabular-nums}
.pd{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:9px;vertical-align:1px;flex:none}
.ptw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bd);border-radius:12px}
.ptab{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:1040px}
.ptab th,.ptab td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
.ptab td{color:#cfcfda}.ptab td.z{color:var(--mu2)}.ptab .tt{font-weight:600;color:var(--fg)}
.ptab thead th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:600;background:#0d0b13}
.ptab tbody th,.ptab tfoot th,.ptab thead th:first-child{text-align:left;position:sticky;left:0;z-index:1;background:#0d0b13;font-weight:500;max-width:210px;min-width:170px;overflow:hidden;text-overflow:ellipsis;box-shadow:1px 0 0 var(--bd)}
.ptab .ps th{color:var(--p3);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding-top:16px}
.ptab .pr{cursor:pointer}.ptab .pr:hover td{background:rgba(168,85,247,.07)}.ptab .pr:hover th{background:#1a1226}

const inM=k=>S.tx.filter(t=>t.data.slice(0,7)===k),sum=a=>a.reduce((s,t)=>s+t.valor,0);
const ent=(k,p)=>sum(inM(k).filter(t=>t.tipo==='receita'&&real(t)&&(!p||t.status==='pago')));

const lim=(k,g)=>{const a=S.bud.filter(b=>b.grupo===g&&b.mes<=k).sort((x,y)=>y.mes.localeCompare(x.mes))[0];return a&&a.limite>0?a.limite:0};

/* ===== Componentes ===== */

const ctit=(n,t)=>`<h3 class="ct">${ic(n,17)}${t}</h3>`;
const empty=(n,t)=>`<div class="empty"><div class="e">${ic(n,20)}</div>${t}</div>`;
const tile=(n,c,s=38,is=18)=>`<div class="kt" style="width:${s}px;height:${s}px;color:${c};background:${hex(c,.09)};border-color:${hex(c,.26)}">${ic(n,is)}</div>`;
const stChip=t=>{const r=t.tipo==='receita';if(t.status==='pago')return`<button class="chip ok" data-a="pay" data-id="${t.id}" title="Clique para voltar a pendente">${ic('check',11,2.4)} ${r?'Recebido':'Pago'}</button>`;
 const d=diff(t.data);return`<button class="chip ${d<0?'late':'pend'}" data-a="pay" data-id="${t.id}" title="Clique para marcar como ${r?'recebido':'pago'}">${ic(d<0?'alert':'clock',11,2.2)} ${d<0?'Atrasado':d===0?'Vence hoje':r?'A receber':'A pagar'}</button>`};

const titem=(t,o={})=>{const r=t.tipo==='receita';return`<div class="tx">${icoB(t)}<div class="tm"><button class="t" data-a="edit" data-id="${t.id}">${esc(t.descricao)}</button><div class="s"><span>${esc(t.categoria)}</span>${o.date?`<span>· ${dc(t.data)}</span>`:''}<span>· ${fpL(t.forma_pagamento)}</span>${recChip(t)}</div></div><div class="tv"><b class="n ${r?'pos':''}">${r?'+':'−'} ${brl(t.valor)}</b>${stChip(t)}</div><div class="tact"><button data-a="edit" data-id="${t.id}" title="Editar">${IC.edit}</button><button class="dl" data-a="delrow" data-id="${t.id}" title="Excluir">${IC.del}</button></div></div>`};
const urow=t=>{const d=diff(t.data),r=t.tipo==='receita';return`<div class="tx">${icoB(t)}<div class="tm"><button class="t" data-a="edit" data-id="${t.id}">${esc(t.descricao)}</button><div class="s"><span class="chip ${d<0?'late':d<=3?'pend':''}">${d<0?`atrasado há ${-d}d`:d===0?'hoje':d===1?'amanhã':`em ${d} dias`} · ${dc(t.data)}</span>${recChip(t)}</div></div><div class="tv"><b class="n ${r?'pos':''}">${r?'+ ':''}${brl(t.valor)}</b></div><button class="ib" data-a="pay" data-id="${t.id}" title="${r?'Marcar como recebido':'Marcar como pago'}">${IC.chk}</button></div>`};
const kpi=(n,l,v,extra='',vc='')=>`<div class="card kpi">${tile(n,'#c4b5fd')}<div style="min-width:0"><div class="lab">${l}</div><div class="kv n"${vc?` style="color:${vc}"`:''}>${v}</div>${extra}</div></div>`;
const trend=(a,b,inv)=>{if(!b)return'';const p=(a-b)/b*100,good=inv?p<=0:p>=0;return`<span class="trend" style="background:${good?'rgba(52,211,153,.08)':'rgba(248,113,113,.08)'};color:${good?'#6ee7b7':'#fca5a5'}">${p>=0?'+':'−'}${Math.abs(p).toFixed(0)}% <span style="opacity:.65;font-weight:500">vs mês anterior</span></span>`};
const bcol=(r,c)=>r>1?'#f87171':r>.85?'#fbbf24':c;

const ring=(p,c,sz,lbl,sub='')=>{const r=sz/2-9,C=2*Math.PI*r,v=Math.max(0,Math.min(1,p)),h=sz/2,id='rg'+(++RG),st=c==='grad'?`url(#${id})`:c;return`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9d5ff"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#6d28d9"/></linearGradient></defs><circle r="${r}" cx="${h}" cy="${h}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="8"/><circle r="${r}" cx="${h}" cy="${h}" fill="none" stroke="${st}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*v} ${C}" transform="rotate(-90 ${h} ${h})"/><text x="${h}" y="${h}" dy="${sub?2:sz/16}" text-anchor="middle" font-size="${sz/5.4}" font-weight="500" fill="#ececf1" letter-spacing="-1" font-family="Inter,sans-serif">${lbl}</text>${sub?`<text x="${h}" y="${h}" dy="${sz/6}" text-anchor="middle" font-size="9" font-weight="600" fill="#8a8a99" letter-spacing="1.4" font-family="Inter,sans-serif">${sub}</text>`:''}</svg>`};

/* ===== Gráficos ===== */
function fluxo(k){
 const ms=[-5,-4,-3,-2,-1,0].map(n=>somaM(k,n)),d=ms.map(m=>[ent(m),sai(m)]);
 const top=Math.max(2000,Math.ceil(Math.max(...d.flat(),1)/2000)*2000),W=640,L=46,B=214,h=196,cw=(W-L)/6;let g='',b='';
 for(let i=0;i<=4;i++){const y=B-h*i/4;g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,${i?.05:.1})" ${i?'stroke-dasharray="2 6"':''}/><text x="${L-10}" y="${y+4}" text-anchor="end" font-size="10.5" fill="#55556a">${vir(+(top*i/4000).toFixed(1))}k</text>`}
 d.forEach(([a,s],i)=>{const x=L+i*cw+cw/2,cur=ms[i]===k;
  if(cur)b+=`<rect x="${x-cw/2+8}" y="4" width="${cw-16}" height="${B+30}" rx="10" fill="rgba(168,85,247,.06)" stroke="rgba(168,85,247,.22)"/>`;
  [[a,'url(#gE)',-24,'Entradas'],[s,'url(#gS)',4,'Saídas']].forEach(([v,c,o,l])=>{const hh=Math.max(3,h*v/top);b+=`<rect x="${x+o}" y="${B-hh}" width="20" height="${hh}" rx="4" fill="${c}"><title>${l} ${mesL(ms[i])}: ${brl(v)}</title></rect>`});
  const sl=a-s;b+=`<text x="${x}" y="${B+18}" text-anchor="middle" font-size="11.5" font-weight="${cur?600:500}" fill="${cur?'#ececf1':'#8a8a99'}">${mesC(ms[i])}</text><text x="${x}" y="${B+32}" text-anchor="middle" font-size="9.5" font-weight="600" fill="${sl>=0?'#6ee7b7':'#fca5a5'}">${sl>=0?'+':'−'}${vir((Math.abs(sl)/1000).toFixed(1))}k</text>`});
 return`<svg viewBox="0 0 ${W} 252" width="100%" role="img" aria-label="Entradas e saídas dos últimos 6 meses"><defs><linearGradient id="gE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8b4fe"/><stop offset="1" stop-color="#6d28d9"/></linearGradient><linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b8ba3"/><stop offset="1" stop-color="#2e2e3d"/></linearGradient></defs>${g}${b}</svg>`}
function donut(k){
 const it=GD.map(g=>[g,gastoG(k,g[0])]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),tot=it.reduce((s,x)=>s+x[1],0);
 if(!tot)return empty('pie','Sem gastos neste mês');
 const r=70,C=2*Math.PI*r;let acc=0,arcs='';
 it.forEach(([g,v])=>{const l=C*v/tot;arcs+=`<circle r="${r}" cx="90" cy="90" fill="none" stroke="${g[3]}" stroke-width="14" stroke-dasharray="${Math.max(.5,l-3)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 90 90)"><title>${g[1]}: ${brl(v)}</title></circle>`;acc+=l});
 return`<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center"><svg viewBox="0 0 180 180" width="172" height="172" style="flex:none"><circle r="${r}" cx="90" cy="90" fill="none" stroke="rgba(255,255,255,.04)" stroke-width="14"/>${arcs}<text x="90" y="82" text-anchor="middle" font-size="9" fill="#8a8a99" font-weight="600" letter-spacing="1.6" font-family="Inter,sans-serif">TOTAL GASTO</text><text x="90" y="104" text-anchor="middle" font-size="18" font-weight="500" fill="#ececf1" letter-spacing="-.6" font-family="Inter,sans-serif">${brl(tot).replace('R$','').trim()}</text></svg><div class="leg" style="flex:1;min-width:190px">${it.slice(0,7).map(([g,v])=>`<div><i style="background:${g[3]}"></i><span>${g[1]}</span><b class="n" style="font-weight:600">${brl(v)}</b><span class="n" style="flex:none;width:36px;text-align:right">${(v/tot*100).toFixed(0)}%</span></div>`).join('')}${it.length>7?`<div class="mu xs">+ ${it.length-7} grupos</div>`:''}</div></div>`}

 +`<div class="gk">${kpi('in','Entradas do mês',brl(E),trend(E,ent(ant)))}${kpi('out','Saídas do mês',brl(Sd),trend(Sd,sai(ant),1))}${kpi('clock','A pagar no mês',brl(sum(aP)),`<div class="mu xs" style="margin-top:6px">${aP.length} conta${aP.length===1?'':'s'} em aberto</div>`)}${kpi('inbox','A receber no mês',brl(sum(aR)),`<div class="mu xs" style="margin-top:6px">${aR.length} entrada${aR.length===1?'':'s'} prevista${aR.length===1?'':'s'}</div>`)}</div>`
 +`<div class="g32"><section class="card"><div class="ch">${ctit('bars','Fluxo dos últimos 6 meses')}<div class="lgd"><span><i style="background:#a855f7"></i>Entradas</span><span><i style="background:#6b6b80"></i>Saídas</span></div></div>${fluxo(k)}</section><section class="card"><div class="ch">${ctit('pie','Distribuição dos gastos')}<span class="mu xs">${mesL(k)}</span></div>${donut(k)}</section></div>`

const MN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

const sumA=a=>a.reduce((s,x)=>s+(+x||0),0);

function gerarProj(ano){

  for(let i=0;i<5000;i++){if(s.vezes&&i>=s.vezes)break;const d=occ(s.inicio,s.freq,i);if(s.ate&&d>s.ate)break;const yy=d.slice(0,4);if(yy>y)break;if(yy===y)v[+d.slice(5,7)-1]+=s.base.valor}

 L.sort((a,b)=>(a.tipo===b.tipo?0:a.tipo==='receita'?-1:1)||sumA(b.v)-sumA(a.v));
 const ms=[-6,-5,-4,-3,-2,-1].map(n=>somaM(MA,n)),av=S.tx.filter(t=>!t.serie&&real(t)&&ms.includes(t.data.slice(0,7)));
 const vr=[];GD.forEach(g=>{const m=r2(sum(av.filter(t=>t.tipo==='despesa'&&grp(t)[0]===g[0]))/6);if(m>=1)vr.push({id:0,nome:g[1]+' · variáveis',tipo:'despesa',cat:null,g:g[0],origem:'var',v:Array(12).fill(m)})});
 vr.sort((a,b)=>b.v[0]-a.v[0]).forEach(l=>{l.id=++id;L.push(l)});
 const mr=r2(sum(av.filter(t=>t.tipo==='receita'))/6);if(mr>=1)L.push({id:++id,nome:'Receitas eventuais',tipo:'receita',cat:null,g:'extra',origem:'var',v:Array(12).fill(mr)});
 return{ini:null,gerado:HJ,seq:id,linhas:L}}
const projOf=ano=>S.proj[ano]||gerarProj(ano);
const ensureP=ano=>(S.proj[ano]=S.proj[ano]||gerarProj(ano));
function iniPadrao(ano){const P=S.proj[ano-1];if(P)return pcalc(P,ano-1).ac[11];const lim=(ano-1)+'-12-31';return r2(S.tx.filter(t=>real(t)&&t.data<=lim).reduce((a,t)=>a+(t.tipo==='receita'?t.valor:-t.valor),0))}

 MN.forEach((m,i)=>{const x=L+i*cw+cw/2;[[c.R[i],'url(#pE)',-15,'Receitas'],[c.D[i],'url(#pS)',1,'Despesas']].forEach(([v,f,o,l])=>{const hh=Math.max(2,h*v/top);b+=`<rect x="${x+o}" y="${B-hh}" width="14" height="${hh}" rx="3" fill="${f}"><title>${l} ${m}: ${brl(v)}</title></rect>`});
  const s=c.sal[i];b+=`<text x="${x}" y="${B+18}" text-anchor="middle" font-size="11" font-weight="500" fill="#8a8a99">${m}</text><text x="${x}" y="${B+32}" text-anchor="middle" font-size="9" font-weight="600" fill="${s>=0?'#6ee7b7':'#fca5a5'}">${s>=0?'+':'−'}${vir((Math.abs(s)/1000).toFixed(1))}k</text>`});

function pacum(c){
 const W=360,H=210,L=12,R=12,T=26,B=180,pts=[c.ini,...c.ac],mn=Math.min(0,...pts),mx=Math.max(...pts,1),rg=mx-mn||1,y=v=>T+(B-T)*(1-(v-mn)/rg),x=i=>L+(W-L-R)*i/12;
 const line=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' '),neg=c.ac[11]<0,col=neg?'#f87171':'#c084fc';
 const z=mn<0?`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 4"/><text x="${W-R}" y="${y(0)-5}" text-anchor="end" font-size="9.5" fill="#8a8a99">zero</text>`:'';
 const lbl=[0,3,6,9,12].map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===12?'end':'middle'}" font-size="10" fill="#8a8a99">${i===0?'início':MN[i-1]}</text>`).join('');

function vProj(){

 <div class="fr"><div><label>${D.rec==='sim'&&!s?'Primeira data':'Data / vencimento'}</label><input type="date" data-d="data" value="${D.data}"></div><div><label>Categoria</label><select data-d="categoria">${catOpts(D.tipo,D.categoria)}</select></div></div>
 <div class="fr"><div><label>Forma de pagamento</label><select data-d="fp" data-r="1">${opt(FP,D.fp)}</select></div><div><label>Situação</label><select data-d="status">${opt([['pago',rc?'Recebido':'Pago'],['pendente',rc?'A receber':'A pagar']],D.status)}</select></div></div>
 ${showP?`<label>Parcelar no cartão</label><select data-d="parcelas" data-r="1">${opt(Array.from({length:24},(_,i)=>[String(i+1),i?`${i+1}x`:'À vista (1x)']),String(np))}</select><div id="pprev">${pprev()}</div>`:''}
 ${box}
 <div id="err" class="sm" style="margin-top:12px;color:#fda4af;min-height:18px;font-weight:600">${D.tried?valid():''}</div>
 <div class="actions" style="margin-top:6px">${D.id?`<button class="btn d" data-a="delrow" data-id="${D.id}">${IC.del} Excluir</button>`:''}<span style="flex:1"></span><button class="btn g" data-a="close">Cancelar</button><button class="btn" id="stx" data-a="savetx" data-enter="1">${IC.chk} Salvar</button></div></div>`)}
function salvarTx(){
 const e=valid();if(e){D.tried=1;upd();return}
 const o={descricao:D.descricao.trim(),valor:r2(num(D.valor)),tipo:D.tipo,categoria:D.categoria,forma_pagamento:D.fp},data=D.data,st=D.status;
 const cfg={freq:D.freq,vezes:D.fim==='vezes'?parseInt(D.vezes):null,ate:D.fim==='data'?D.ate:null};
 const nova=(ini,base,c,sts,anc)=>{const s={id:nid(),inicio:ini,...c,next:0,ativa:true,base};S.series.push(s);if(anc){Object.assign(anc,{serie:s.id,idx:0});s.next=1}gerarS(s,sts);return s};
 const np=parseInt(D.parcelas)||1;let msg='Lançamento salvo';
 if(D.serie){const s=serie(D.serie),t=S.tx.find(x=>x.id===D.id);Object.assign(t,o,{data,status:st});
  if(D.esc==='futuros'){S.tx=S.tx.filter(x=>!(x.serie===s.id&&x.idx>t.idx&&x.status==='pendente'));s.ativa=false;
   if(D.rec==='sim'){nova(data,{...o},cfg,null,t);msg='Recorrência atualizada'}else msg='Recorrência encerrada'}}
 else if(D.rec==='sim'){let t=D.id&&S.tx.find(x=>x.id===D.id);
  if(t)Object.assign(t,o,{data,status:st,parcelas:1});else{t={id:nid(),...o,data,status:st,parcelas:1,observacao:'',serie:null,idx:0};S.tx.push(t)}
  const s=nova(data,{...o},cfg,st,t);msg=`Recorrência criada · ${txS(s.id).length} lançamentos`}
 else if(D.tipo==='despesa'&&D.fp==='credito'&&np>1){if(D.id)S.tx=S.tx.filter(x=>x.id!==D.id);nova(data,{...o,valor:r2(o.valor/np)},{freq:'mensal',vezes:np,ate:null},st);msg=`${np} parcelas lançadas`}
 else{const t=D.id&&S.tx.find(x=>x.id===D.id);if(t)Object.assign(t,o,{data,status:st});else S.tx.push({id:nid(),...o,data,status:st,parcelas:1,observacao:'',serie:null,idx:0})}
 save();closeM();render();toast(msg)}
function delAsk(id){const t=S.tx.find(x=>x.id===id);if(!t)return;const s=t.serie&&serie(t.serie);D={del:id};
 openM(`<div class="card s"><div class="mh"><h3>Excluir lançamento</h3><button class="ib" data-a="close" aria-label="Fechar">${IC.x}</button></div><div class="tx" style="background:var(--sf);border-color:var(--bd)">${icoB(t)}<div class="tm"><b>${esc(t.descricao)}</b><div class="s">${dcy(t.data)} · ${brl(t.valor)}</div></div></div>`
 +(s?`<p class="mu sm">Este lançamento faz parte de uma recorrência <b style="color:var(--fg)">${fq(s.freq)[1].toLowerCase()}</b>. O que deseja excluir?</p><div style="display:grid;gap:8px"><button class="btn g" data-a="dx" data-m="um">Só este lançamento</button><button class="btn g" data-a="dx" data-m="fut">Este e os próximos</button><button class="btn d" data-a="dx" data-m="all">Toda a série (inclusive os já pagos)</button></div>`
 :`<p class="mu sm">Esta ação não pode ser desfeita.</p><div class="actions"><span style="flex:1"></span><button class="btn g" data-a="close">Cancelar</button><button class="btn d" data-a="dx" data-m="um">${IC.del} Excluir</button></div>`)+'</div>')}
function budDlg(gid){const g=gById(gid),l=lim(U.mes,gid),md=[1,2,3].reduce((s,i)=>s+gastoG(somaM(U.mes,-i),gid),0)/3;D={g:gid};
 openM(`<div class="card s"><div class="mh"><div class="fx">${tile(g[2],g[3])}<h3>Limite · ${g[1]}</h3></div><button class="ib" data-a="close" aria-label="Fechar">${IC.x}</button></div><label>Quanto você quer gastar por mês</label><div class="vin"><span>R$</span><input id="bv" inputmode="decimal" placeholder="0,00" value="${l?vir(l):''}"></div><div class="note info">Média dos últimos 3 meses: <b>${brl(md)}</b>${md?` · <button class="link" data-a="bavg" data-v="${r2(md)}">usar este valor</button>`:''}</div><div class="mu xs" style="margin-top:10px">Vale a partir de ${mesL(U.mes)} e segue para os meses seguintes.</div><div class="mu xs" style="margin-top:6px">Inclui: ${g[4].join(', ')}.</div><div class="actions">${l?'<button class="btn d" data-a="bdel" data-two="Confirmar?">Remover limite</button>':''}<span style="flex:1"></span><button class="btn g" data-a="close">Cancelar</button><button class="btn" data-a="bsave" data-enter="1">${IC.chk} Salvar</button></div></div>`)}
const setBud=v=>{const e=S.bud.find(x=>x.mes===U.mes&&x.grupo===D.g);if(e)e.limite=v;else S.bud.push({mes:U.mes,grupo:D.g,limite:v})};

/* ===== Eventos ===== */
document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-a]');if(!b){if(ev.target.id==='md')closeM();return}
 if(b.dataset.two&&!b.dataset.ok){b.dataset.ok=1;const old=b.innerHTML;b.textContent=b.dataset.two;setTimeout(()=>{if(b.isConnected){delete b.dataset.ok;b.innerHTML=old}},4000);return}
 const a=b.dataset.a,id=+b.dataset.id,v=b.dataset.v,go=m=>{save();closeM();render();if(m)toast(m)};
 if(projAct(a,b))return;
 switch(a){
 case'go':U.v=v;if(v==='lanc'&&U.fs==='atrasado')U.fs='all';scrollTo(0,0);render();break;
 case'mm':U.mes=somaM(U.mes,+b.dataset.n);render();break;
 case'new':txDlg(null,{rec:!!b.dataset.rec});break;
 case'edit':txDlg(S.tx.find(t=>t.id===id));break;
 case'pay':{const t=S.tx.find(t=>t.id===id);t.status=t.status==='pago'?'pendente':'pago';go(t.status==='pago'?(t.tipo==='receita'?'Marcado como recebido':'Marcado como pago'):'Voltou para pendente');break}
 case'late':U.v='lanc';U.fs='atrasado';scrollTo(0,0);render();break;
 case'tipo':if(D.tipo!==v){D.tipo=v;D.keep=false;drawTx()}break;
 case'rec':D.rec=v;drawTx();break;
 case'esc':D.esc=v;D.rec='sim';drawTx();break;
 case'close':closeM();break;
 case'savetx':salvarTx();break;
 case'delrow':delAsk(id);break;
 case'dx':{const t=S.tx.find(x=>x.id===D.del),m=b.dataset.m;if(!t)break;
  if(m==='um')S.tx=S.tx.filter(x=>x!==t);
  else if(m==='fut'){const s=serie(t.serie);S.tx=S.tx.filter(x=>!(x.serie===t.serie&&x.idx>=t.idx));if(s)s.ativa=false}
  else{S.series=S.series.filter(s=>s.id!==t.serie);S.tx=S.tx.filter(x=>x.serie!==t.serie)}
  go('Excluído');break}
 case'bud':budDlg(b.dataset.g);break;
 case'bavg':$('#bv').value=vir(v);break;
 case'bsave':{const n=num($('#bv').value);if(n<=0){$('#bv').focus();break}setBud(n);go('Limite salvo');break}
 case'bdel':setBud(0);go('Limite removido');break;
 case'sedit':{const ts=txS(id).sort((x,y)=>x.data.localeCompare(y.data)),t=ts.find(x=>x.status==='pendente'&&x.data>=HJ)||ts.find(x=>x.status==='pendente')||ts[ts.length-1];if(t)txDlg(t,{esc:'futuros'});break}
 case'send':{const s=serie(id);S.tx=S.tx.filter(t=>!(t.serie===id&&t.status==='pendente'&&t.data>HJ));if(s)s.ativa=false;go('Recorrência encerrada');break}
 case'sdelall':S.tx=S.tx.filter(t=>t.serie!==id);S.series=S.series.filter(s=>s.id!==id);go('Série excluída');break;
 case'ssave':{const f=U.f,c=calc();S.sim.push({id:nid(),descricao:f.descricao.trim(),categoria:f.categoria,valor_total:c.tot,entrada:c.en,parcelas:c.n,primeira_parcela:f.primeira,impacto_mensal:r2(c.p)});go('Simulação salva');break}
 case'slanc':{const c=calc(),f=U.f,ini=f.primeira||somaM(MA,1)+'-10',d=f.descricao.trim(),base={descricao:d,tipo:'despesa',categoria:f.categoria,forma_pagamento:'credito'};
  if(c.en>0)S.tx.push({id:nid(),...base,descricao:d+' (entrada)',forma_pagamento:'pix',valor:r2(c.en),data:HJ,status:'pago',parcelas:1,observacao:'',serie:null,idx:0});
  if(c.fin>0){if(c.n>1){const s={id:nid(),inicio:ini,freq:'mensal',vezes:c.n,ate:null,next:0,ativa:true,base:{...base,valor:r2(c.p)}};S.series.push(s);gerarS(s,null)}
   else S.tx.push({id:nid(),...base,valor:r2(c.fin),data:ini,status:ini<=HJ?'pago':'pendente',parcelas:1,observacao:'',serie:null,idx:0})}
  U.v=c.n>1?'rec':'lanc';scrollTo(0,0);go('Compra lançada');break}
 case'sload':{const s=S.sim.find(x=>x.id===id);U.f={descricao:s.descricao,total:vir(s.valor_total),entrada:s.entrada?vir(s.entrada):'',parcelas:s.parcelas,categoria:s.categoria,primeira:s.primeira_parcela};scrollTo(0,0);render();break}
 case'sdel':S.sim=S.sim.filter(x=>x.id!==id);go();break;
 case'exp':{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));l.download='carteira-backup-'+HJ+'.json';document.body.appendChild(l);l.click();l.remove();toast('Backup gerado');break}
 case'imp':$('#fi').click();break;
 case'demo':seed();go('Dados de exemplo carregados');break;
 case'keepdemo':S.demo=false;go();break;
 case'zero':S=vazio();go('Tudo apagado');break}
});
document.addEventListener('input',ev=>{const t=ev.target,d=t.dataset;
 if(d.k!==undefined){U.f[d.k]=t.value;$('#res').innerHTML=simRes()}
 else if(d.f){U[d.f]=t.value;$('#lres').innerHTML=lres()}
 else if(d.d){D[d.d]=t.value;if(d.r)drawTx();else upd()}
 else if(d.p!==undefined)D[d.p]=t.value;
 else if(d.pm!==undefined){D.v[+d.pm]=t.value;const e=$('#pltot');if(e)e.innerHTML=pltot()}});
document.addEventListener('change',ev=>{if(ev.target.dataset.pi){projIni(ev.target);return}if(ev.target.id!=='fi')return;const f=ev.target.files[0];if(!f)return;
 f.text().then(x=>{const o=JSON.parse(x);if(!o||!Array.isArray(o.tx))throw 0;S={...vazio(),...o};S.demo=false;S.proj=S.proj||{};S.seq=S.seq||Math.max(0,...S.tx.map(t=>t.id));S.series.forEach(s=>gerarS(s));save();render();toast('Backup restaurado')}).catch(()=>toast('Arquivo inválido')).finally(()=>{ev.target.value=''})});
document.addEventListener('keydown',ev=>{if(!$('#md').classList.contains('on'))return;
 if(ev.key==='Escape')closeM();else if(ev.key==='Enter'&&ev.target.tagName==='INPUT'){ev.preventDefault();const b=$('#md [data-enter]');if(b)b.click()}});
boot();render();
</script></body></html>
